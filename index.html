
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Geolocation Tool</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 30px 15px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
}

.container {
    max-width: 850px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #38bdf8;
}

.description {
    text-align: center;
    color: #94a3b8;
}

.search-box {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

input, button {
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
}

input {
    flex: 1;
    min-width: 0;
    background: #1e293b;
    border: 1px solid #475569;
    color: white;
}

button {
    background: #38bdf8;
    color: #082f49;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#status {
    text-align: center;
    margin: 15px 0;
    color: #facc15;
    overflow-wrap: anywhere;
}

.results {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

.card {
    padding: 20px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    overflow-wrap: anywhere;
}

.card h2 {
    color: #38bdf8;
    font-size: 19px;
}

.field {
    padding: 10px 0;
    border-bottom: 1px solid #334155;
}

.label {
    display: block;
    color: #94a3b8;
    font-size: 12px;
    margin-bottom: 5px;
    text-transform: uppercase;
}

a {
    display: inline-block;
    margin-top: 15px;
    color: #4ade80;
}

.notice {
    margin-top: 25px;
    padding: 15px;
    background: #172554;
    border-radius: 8px;
    color: #bfdbfe;
    font-size: 14px;
}

@media (max-width: 650px) {
    .results { grid-template-columns: 1fr; }
    .search-box { flex-direction: column; }
}
</style>
</head>

<body>
<main class="container">

<h1>IP Geolocation Tool</h1>
<p class="description">
Find the approximate location of a public IPv4 address.
</p>

<form id="lookupForm" class="search-box">
    <input
        id="ipInput"
        type="text"
        placeholder="192.168.001.001"
        maxlength="15"
        inputmode="numeric"
        autocomplete="off"
        spellcheck="false"
        required
        aria-label="IPv4 address"
    >
    <button id="searchButton" type="submit">Search IP</button>
</form>

<div id="status" role="status" aria-live="polite">
Enter an IPv4 address.
</div>

<section id="results" class="results"></section>

<div class="notice">
<strong>Accuracy:</strong> IP geolocation is approximate.
VPNs, proxies and mobile networks can affect results.
Private IPs cannot normally be geolocated to a public location.
</div>

</main>

<script>
const form = document.getElementById("lookupForm");
const input = document.getElementById("ipInput");
const button = document.getElementById("searchButton");
const status = document.getElementById("status");
const results = document.getElementById("results");

// Automatically format digits as xxx.xxx.xxx.xxx
input.addEventListener("input", function () {
    const digits = this.value.replace(/\D/g, "").slice(0, 12);
    const parts = digits.match(/.{1,3}/g) || [];
    this.value = parts.join(".").slice(0, 15);
});

// Validate the four IPv4 octets
function isValidIPv4(ip) {
    const parts = ip.split(".");

    if (parts.length !== 4) return false;

    return parts.every(part =>
        /^\d{1,3}$/.test(part) &&
        Number(part) >= 0 &&
        Number(part) <= 255
    );
}

// Reject private and reserved IPv4 ranges
function isPublicIPv4(ip) {
    const p = ip.split(".").map(Number);
    const [a, b] = p;

    if (a === 0 || a === 10 || a === 127) return false;
    if (a === 169 && b === 254) return false;
    if (a === 172 && b >= 16 && b <= 31) return false;
    if (a === 192 && b === 168) return false;
    if (a === 100 && b >= 64 && b <= 127) return false;
    if (a >= 224) return false;

    return true;
}

function addField(card, label, value) {
    const field = document.createElement("div");
    field.className = "field";

    const title = document.createElement("span");
    title.className = "label";
    title.textContent = label;

    const content = document.createElement("span");
    content.textContent =
        value === null || value === undefined || value === ""
        ? "Unavailable"
        : String(value);

    field.append(title, content);
    card.appendChild(field);
}

async function fetchProvider(name, url) {
    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (data.error === true ||
            data.success === false ||
            !data.ip) {
            throw new Error(data.reason || "No data returned");
        }

        return { name, data, error: null };
    } catch (error) {
        return { name, data: null, error: error.message };
    }
}

function renderProvider(provider) {
    const card = document.createElement("article");
    card.className = "card";

    const heading = document.createElement("h2");
    heading.textContent = provider.name;
    card.appendChild(heading);

    if (!provider.data) {
        addField(card, "Status", "Lookup failed: " + provider.error);
        return card;
    }

    const d = provider.data;

    addField(card, "IP Address", d.ip);
    addField(
        card,
        "Location",
        [d.city, d.region || d.region_name,
         d.country_name || d.country].filter(Boolean).join(", ")
    );
    addField(card, "Country Code", d.country_code);
    addField(
        card,
        "Coordinates",
        d.latitude != null && d.longitude != null
            ? d.latitude + ", " + d.longitude
            : "Unavailable"
    );
    addField(
        card,
        "ISP / Organization",
        d.org || d.connection?.isp || d.connection?.org
    );
    addField(card, "ASN", d.asn || d.connection?.asn);
    addField(
        card,
        "Timezone",
        typeof d.timezone === "object"
            ? d.timezone?.id
            : d.timezone
    );
    addField(card, "Postal Code", d.postal);

    if (d.latitude != null && d.longitude != null) {
        const link = document.createElement("a");
        link.href = "https://www.google.com/maps?q=" +
            encodeURIComponent(d.latitude + "," + d.longitude);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open approximate location in Google Maps";
        card.appendChild(link);
    }

    return card;
}

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const ip = input.value.trim();
    results.replaceChildren();

    if (!isValidIPv4(ip)) {
        status.textContent =
            "Invalid IP. Enter four numbers from 0 to 255.";
        input.focus();
        return;
    }

    if (!isPublicIPv4(ip)) {
        status.textContent =
            "This is a private or reserved IP, not a normal public IP.";
        return;
    }

    button.disabled = true;
    button.textContent = "Searching...";
    status.textContent = "Checking two geolocation providers...";

    try {
        const encodedIP = encodeURIComponent(ip);

        const providers = await Promise.all([
            fetchProvider(
                "Provider 1 — ipapi.co",
                `https://ipapi.co/${encodedIP}/json/`
            ),
            fetchProvider(
                "Provider 2 — ipwho.is",
                `https://ipwho.is/${encodedIP}`
            )
        ]);

        providers.forEach(provider =>
            results.appendChild(renderProvider(provider))
        );

        const good = providers.filter(p => p.data);

        if (good.length === 0) {
            status.textContent =
                "Both providers failed. Check your connection and try again.";
        } else if (good.length === 1) {
            status.textContent =
                "Only one provider returned data. Location is approximate.";
        } else {
            const a = good[0].data;
            const b = good[1].data;

            const sameCountry =
                a.country_code && b.country_code &&
                a.country_code.toUpperCase() ===
                b.country_code.toUpperCase();

            const sameCity =
                a.city && b.city &&
                a.city.toLowerCase() === b.city.toLowerCase();

            status.textContent = sameCountry && sameCity
                ? "Both providers agree on city and country, but accuracy is not guaranteed."
                : "Providers disagree. Compare their results; neither is guaranteed correct.";
        }
    } finally {
        button.disabled = false;
        button.textContent = "Search IP";
    }
});
</script>
</body>
</html>
